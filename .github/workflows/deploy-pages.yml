# Deploys the PKM app to GitHub Pages so it can be opened from any device
# (e.g. an Android phone browser): https://helmdubo.github.io/helmdubo/
#
# This repo's Pages is configured in "deploy from branch" mode serving the
# gh-pages branch, so the workflow publishes the build by pushing to that
# branch (actions/deploy-pages requires the "GitHub Actions" source mode and
# fails here — see run #1 of this workflow).
#
# Note on headers: GitHub Pages cannot send COOP/COEP, so the app runs
# without cross-origin isolation there. That's fine — storage uses the OPFS
# SAH Pool VFS, which needs no SharedArrayBuffer (see pkm-app/spike/FINDINGS.md).
name: Deploy PKM app to GitHub Pages

on:
  push:
    branches:
      - claude/pkm-board-cloud-v4-5ul78y
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkm-app/package-lock.json
      - name: Install dependencies
        working-directory: pkm-app
        run: npm ci
      - name: Build (base path = /<repo>/ for project pages)
        working-directory: pkm-app
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pkm-app/dist
          publish_branch: gh-pages
          enable_jekyll: false
