# Deploys the PKM app to GitHub Pages so it can be opened from any device
# (e.g. an Android phone browser).
#
# Note on headers: GitHub Pages cannot send COOP/COEP, so the app runs
# without cross-origin isolation there. That's fine — storage uses the OPFS
# SAH Pool VFS, which needs no SharedArrayBuffer (see pkm-app/spike/FINDINGS.md).
name: Deploy PKM app to GitHub Pages

on:
  push:
    branches:
      - claude/pkm-board-cloud-v4-5ul78y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkm-app/package-lock.json
      - name: Install dependencies
        working-directory: pkm-app
        run: npm ci
      - name: Build (base path = /<repo>/ for project pages)
        working-directory: pkm-app
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: Configure Pages (enables Pages on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pkm-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
